name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Internal link & anchor integrity
        run: ./scripts/check-links.sh

      - name: HTML structural check
        run: python3 scripts/check-html.py

      - name: Assemble publish directory (matches amplify.yml)
        # Proves the deploy build works and never ships internal docs.
        run: |
          rm -rf dist && mkdir -p dist
          cp index.html 404.html dist/
          cp -r pricing developers contact assets dist/
          echo "Published files:"; find dist -type f | sort
          # Guard: nothing from marketing/ or docs/ must ever reach dist.
          if find dist -path '*/marketing/*' -o -name '*.md' | grep -q .; then
            echo "ERROR: internal docs leaked into publish dir"; exit 1
          fi

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7
